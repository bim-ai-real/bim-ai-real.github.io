<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM + AI Lab</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f1ec;
      color: #29332f;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(80%, 600px);
      padding: 48px 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 40px;
    }

    p {
      line-height: 1.8;
      color: #66706b;
    }
  </style>
</head>
<body>
  <main>
    <h1>BIM + AI Lab</h1>
  </main>
  <div id="viewer"></div>

  <div id="info">點擊構件後顯示資料</div>

  <script src="app.js">
function createWall(wall) {
  const dx = wall.endX - wall.startX;
  const dy = wall.endY - wall.startY;

  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);

  const centerX = (wall.startX + wall.endX) / 2;
  const centerZ = (wall.startY + wall.endY) / 2;

  const geometry = new THREE.BoxGeometry(
    length,
    wall.height,
    wall.thickness
  );

  const material = new THREE.MeshStandardMaterial({
    color: 0xe8e3d9
  });

  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(
    centerX,
    wall.height / 2,
    centerZ
  );

  mesh.rotation.y = -angle;

  mesh.userData = {
    id: wall.id,
    type: "wall",
    data: wall
  };

  scene.add(mesh);
}
    
  </script>
  
</body>
</html>
